<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP 로또 번호 생성기</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glitch-bg"></div>
    <div class="particles"></div>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="glitch" data-text="VIP">VIP</span>
                <span class="title-glow">로또 번호 생성기</span>
            </h1>
            <p class="subtitle">당신의 행운을 잡아라!</p>
        </header>

        <main>
            <div class="controls">
                <button id="generateBtn" class="generate-btn">
                    <span class="btn-text">💰 번호 생성하기</span>
                    <span class="btn-shine"></span>
                </button>
                <button id="clearBtn" class="clear-btn">초기화</button>
            </div>

            <div id="resultContainer" class="result-container">
                <div class="result-label">
                    <span class="label-glow">추천 번호</span>
                </div>
                <div id="numbers" class="numbers"></div>
                <div id="bonusContainer" class="bonus-container" style="display: none;">
                    <div class="bonus-label">
                        <span class="label-glow">보너스 번호</span>
                    </div>
                    <div id="bonusNumber" class="bonus-number"></div>
                </div>
            </div>

            <div class="history-section">
                <h3 class="section-title">
                    <span class="title-border">생성 기록</span>
                </h3>
                <div id="history" class="history"></div>
            </div>
        </main>

        <aside class="reference-section">
            <h3 class="section-title">
                <span class="title-border">이전 3개월 1등 당첨 번호</span>
            </h3>
            <div id="referenceData" class="reference-data"></div>
        </aside>

        <footer>
            <p class="disclaimer">※ 본 서비스는 참고용이며, 실제 당첨을 보장하지 않습니다.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
