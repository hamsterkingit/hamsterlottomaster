<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTTO PLAYER</title>
    <meta name="version" content="2026-03-11-v3">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <!-- Player Profile Section -->
        <div class="profile-box">
            <div class="trainer-sprite">👤</div>
            <div class="profile-info">
                <div class="profile-label">TRAINER</div>
                <div class="profile-number">No. 00001</div>
                <div class="profile-title">LOTTO PLAYER</div>
            </div>
        </div>

        <!-- Number Generation Section -->
        <div class="generation-box">
            <div class="set-count">
                <span>SET COUNT:</span>
                <input type="number" id="setCount" value="1" min="1" max="10">
            </div>
            <button id="generateBtn" class="fight-btn">
                <span class="play-icon">►</span>FIGHT
            </button>
            <div id="generationMessage" class="generation-message"></div>
        </div>

        <!-- Current Set Display -->
        <div class="current-set-box" id="currentSetBox" style="display: none;">
            <div class="set-header">
                <span class="set-label">세트 1</span>
                <span class="set-numbers" id="currentSetNumbers"></span>
            </div>
            <div class="pokemon-frames" id="currentPokemonFrames"></div>
        </div>

        <!-- Saved Numbers Section -->
        <div class="saved-box">
            <div class="section-title">SAVED NUMBERS</div>
            <div id="savedNumbers" class="saved-numbers-container"></div>
            <div class="pagination" id="pagination" style="display: none;">
                <button class="page-btn" id="prevPage">◄</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button class="page-btn" id="nextPage">►</button>
            </div>
        </div>

        <!-- Recent Winners Section -->
        <div class="winners-box">
            <div class="section-title">RECENT WINNERS</div>
            <div id="recentWinners" class="winners-container"></div>
        </div>
    </div>

    <!-- Supabase 클라이언트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase 설정 -->
    <script src="supabase-config.js"></script>
    <!-- 메인 스크립트 -->
    <script src="script.js"></script>
</body>
</html>
