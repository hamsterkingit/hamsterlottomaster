<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>몬스터 로또 번호 생성기</title>
    <meta name="version" content="2026-03-11-v2">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="monster-bg"></div>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="monster-title">🎲 몬스터</span>
                <span class="title-cute">로또 번호 생성기</span>
            </h1>
            <p class="subtitle">귀여운 몬스터들과 함께 행운을 잡아봐요! 🎉</p>
        </header>

        <main>
            <div class="controls">
                <button id="generateBtn" class="generate-btn">
                    <span class="btn-text">🎲 번호 생성하기</span>
                    <span class="btn-shine"></span>
                </button>
                <button id="clearBtn" class="clear-btn">초기화</button>
            </div>

            <div id="resultContainer" class="result-container">
                <div class="result-label">
                    <span class="label-glow">추천 번호</span>
                </div>
                <div id="numbers" class="numbers"></div>
                <div id="bonusContainer" class="bonus-container" style="display: none;">
                    <div class="bonus-label">
                        <span class="label-glow">보너스 번호</span>
                    </div>
                    <div id="bonusNumber" class="bonus-number"></div>
                </div>
            </div>

            <div class="history-section">
                <h3 class="section-title">
                    <span class="title-border">생성 기록</span>
                </h3>
                <div id="history" class="history"></div>
            </div>
        </main>

        <aside class="reference-section">
            <h3 class="section-title">
                <span class="title-border">이전 3개월 1등 당첨 번호</span>
            </h3>
            <div id="referenceData" class="reference-data"></div>
        </aside>

        <footer>
            <p class="disclaimer">※ 본 서비스는 참고용이며, 실제 당첨을 보장하지 않습니다.</p>
            <p style="font-size: 0.7em; color: rgba(255,255,255,0.3); margin-top: 10px;">v2026-03-11-v2</p>
        </footer>
    </div>

    <!-- Supabase 클라이언트 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Supabase 설정 -->
    <script src="supabase-config.js"></script>
    <!-- 메인 스크립트 -->
    <script src="script.js"></script>
</body>
</html>
