<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API 테스트</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-result {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
        }
        .error {
            border-left-color: #f44336;
        }
        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <h1>🔍 Vercel API 엔드포인트 테스트</h1>
    <button onclick="testAPI()">API 테스트 실행</button>
    <div id="result"></div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>테스트 중...</p>';
            
            try {
                console.log('📡 API 엔드포인트 호출: /api/config');
                const response = await fetch('/api/config');
                
                console.log('📥 응답 상태:', response.status, response.statusText);
                
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `
                        <div class="test-result">
                            <h3>✅ 성공!</h3>
                            <p><strong>상태:</strong> ${response.status} ${response.statusText}</p>
                            <p><strong>Supabase URL:</strong> ${data.supabaseUrl ? data.supabaseUrl.substring(0, 30) + '...' : '없음'}</p>
                            <p><strong>Supabase Key:</strong> ${data.supabaseAnonKey ? data.supabaseAnonKey.substring(0, 20) + '...' : '없음'}</p>
                            ${data.debug ? `
                                <h4>디버깅 정보:</h4>
                                <pre>${JSON.stringify(data.debug, null, 2)}</pre>
                            ` : ''}
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="test-result error">
                            <h3>❌ 오류 발생</h3>
                            <p><strong>상태:</strong> ${response.status} ${response.statusText}</p>
                            <p><strong>오류:</strong> ${data.error || '알 수 없는 오류'}</p>
                            <p><strong>메시지:</strong> ${data.message || ''}</p>
                            ${data.debug ? `
                                <h4>디버깅 정보:</h4>
                                <pre>${JSON.stringify(data.debug, null, 2)}</pre>
                            ` : ''}
                            <h4>💡 해결 방법:</h4>
                            <ol>
                                <li>Vercel 대시보드 → Settings → Environment Variables</li>
                                <li>NEXT_PUBLIC_SUPABASE_URL 추가</li>
                                <li>NEXT_PUBLIC_SUPABASE_ANON_KEY 추가</li>
                                <li>환경변수 추가 후 Redeploy 실행</li>
                            </ol>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="test-result error">
                        <h3>❌ 네트워크 오류</h3>
                        <p><strong>오류:</strong> ${error.message}</p>
                        <p>API 엔드포인트를 호출할 수 없습니다.</p>
                        <h4>💡 확인 사항:</h4>
                        <ol>
                            <li>배포가 완료되었는지 확인</li>
                            <li>api/config.js 파일이 올바른 위치에 있는지 확인</li>
                            <li>브라우저 콘솔(F12)에서 추가 오류 확인</li>
                        </ol>
                    </div>
                `;
            }
        }
        
        // 페이지 로드 시 자동 테스트
        window.addEventListener('load', () => {
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
